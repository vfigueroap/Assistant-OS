name: Verify Assistant OS
on:
  push:
    branches: [main]
  pull_request:
jobs:
  web-and-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node --test tests/gym/*.test.mjs
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.hp.example .env.hp
      - run: docker compose -f infra/compose.yaml build
