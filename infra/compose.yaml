services:
  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    env_file:
      - ../.env.hp
    environment:
      WORKER_STATE_DIR: /state
      EXTRACTOR_URL: http://extractor:8080
      CAPTURE_LOCAL_DIR: /homelab/captures
      DASHBOARD_INBOX_DIR: /homelab/inbox
    group_add:
      - "${HOMELAB_GROUP_ID:-2000}"
    volumes:
      - worker-state:/state
      - type: bind
        source: ${HOMELAB_DATA_DIR:-../.local/homelab}
        target: /homelab
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    networks:
      - egress
      - extract
    depends_on:
      - extractor
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
  extractor:
    build:
      context: ..
      dockerfile: services/extractor/Dockerfile
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    networks:
      - extract
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
networks:
  egress: {}
  extract:
    internal: true
volumes:
  worker-state: {}
